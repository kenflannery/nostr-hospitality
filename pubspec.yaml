name: nostr_hospitality
description: "Hospitality Libre: Open-source, decentralized social hospitality network built on Nostr."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  ndk: ^0.9.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
